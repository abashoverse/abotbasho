services:
  indexer-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ponder}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ponder}
      - POSTGRES_DB=${POSTGRES_DB:-abotbasho}
    volumes:
      - indexer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ponder} -d ${POSTGRES_DB:-abotbasho}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  indexer:
    build: .
    image: abotbasho:latest
    command: bun --filter '@abotbasho/indexer' start
    env_file: .env
    environment:
      - DATABASE_SCHEMA=${POSTGRES_DB:-abotbasho}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ponder}:${POSTGRES_PASSWORD:-ponder}@indexer-db:5432/${POSTGRES_DB:-abotbasho}
    depends_on:
      indexer-db:
        condition: service_healthy
    volumes:
      - indexer-data:/app/packages/indexer/.ponder
    restart: unless-stopped
    # Normal steady state is ~450 MB. Without a cap a leak grew it to 4.2 GB,
    # the event loop stalled for ~100 min (504s on verify links) and the host
    # OOM killer eventually picked it. With the cap it dies early and
    # `restart` brings it back in seconds, without starving other containers.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "5", "http://localhost:42069/health"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 90s
    # Docker never restarts a container just for being unhealthy. The
    # autoheal service below does, for containers carrying this label.
    labels:
      - abotbasho.autoheal=true

  discord:
    build: .
    image: abotbasho:latest
    command: bun --filter '@abotbasho/discord' start
    env_file: .env
    environment:
      - INDEXER_SQL_URL=http://indexer:42069/sql
      - CURSOR_FILE=/data/cursor.json
      - DISCORD_CONFIG_FILE=/data/config.json
      - DISCORD_DATA_DIR=/data
    volumes:
      - discord-data:/data
    depends_on:
      indexer:
        condition: service_healthy
    restart: unless-stopped

  twitter:
    build: .
    image: abotbasho:latest
    command: bun --filter '@abotbasho/twitter' start
    env_file: .env
    environment:
      - INDEXER_SQL_URL=http://indexer:42069/sql
      - CURSOR_FILE=/data/cursor.json
    volumes:
      - twitter-data:/data
    depends_on:
      indexer:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Telegram bot. Only needed when abotbasho.config.ts has
  # verify.telegram configured. Same image as the indexer/discord services.
  telegram:
    build: .
    image: abotbasho:latest
    command: bun --filter '@abotbasho/telegram' start
    env_file: .env
    environment:
      - INDEXER_SQL_URL=http://indexer:42069/sql
      - TELEGRAM_DATA_DIR=/data
    volumes:
      - telegram-data:/data
    depends_on:
      indexer:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["telegram"]

  # Optional: holder-verification web frontend.
  # Only needed when abotbasho.config.ts has `verify.enabled: true`.
  # Put a TLS-terminating reverse proxy (Caddy / Traefik / nginx) in front of
  # this service — never expose :3000 directly to the public internet.
  verify-web:
    build:
      context: .
      dockerfile: packages/verify-web/Dockerfile
    image: abotbasho-verify-web:latest
    env_file: .env
    environment:
      - INDEXER_URL=http://indexer:42069
      - PUBLIC_WALLETCONNECT_PROJECT_ID=${WALLETCONNECT_PROJECT_ID:-}
    # Host port is configurable via VERIFY_WEB_HOST_PORT (default 3000) so
    # this doesn't collide with another service on the same host. Bound to
    # loopback only — front it with a TLS-terminating reverse proxy. The
    # container always listens on 3000 internally; only the host mapping
    # changes.
    ports:
      - "127.0.0.1:${VERIFY_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      indexer:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["verify"]

  # Restarts containers labelled `abotbasho.autoheal=true` once their
  # healthcheck reports unhealthy (indexer: 4 failed checks, ~2 min). The
  # label is project-specific so other stacks on the same host stay untouched.
  # Needs the Docker socket, which is root-equivalent on the host. `:ro` does
  # not restrict API calls, so only run it on hosts you control.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=abotbasho.autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  indexer-db-data:
  indexer-data:
  discord-data:
  twitter-data:
  telegram-data:
